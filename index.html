<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeresF3b</title>
    <meta name="description" content="Welcome to CeresF3b's website, a passionate gamer, cybersecurity enthusiast, and tech lover.">
    <meta name="keywords" content="CeresF3b, gaming, cybersecurity, technology, Helldiver, Doom, TF2">
    <meta name="author" content="CeresF3b">
    <link rel="icon" type="image/png" href="path/to/favicon.png">
    
    <!-- Combined Fonts and Styles -->
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('https://your-website.com/fonts/PixelFont.woff2') format('woff2');
        }

        body {
            background-color: #000000;
            color: white;
            font-family: 'PixelFont', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 0;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            z-index: 1;
            margin: 0 auto;
            padding: 20px;
            max-width: 800px;
            pointer-events: none;
        }

        .container > * {
            pointer-events: auto;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
        }

        .social-buttons img {
            width: 50px;
            height: 50px;
        }

        .icon {
            width: 50px;
            height: 50px;
            vertical-align: middle;
        }

        .icon-rounded {
            border-radius: 10px;
        }

        .label {
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        .item {
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item {
            animation: fadeIn 1s ease-out;
        }

        .icon:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }

        /* Light Mode Styles */
        .light-mode {
            background-color: #ffffff;
            color: #000000;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
                max-width: 95%;
            }
            
            .icon {
                width: 40px;
                height: 40px;
            }
            
            .label {
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }

        /* Aggiungi queste regole per rimuovere i puntini dall'elenco */
        ul {
            list-style-type: none;
            padding: 0;
        }

    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1>CeresF3b</h1>

        <div class="item">
            <img src="https://cdn2.steamgriddb.com/icon/0ec73496338b196fb1394ea142533248/32/256x256.png" alt="Helldiver" class="icon">
            <span class="label">Helldiver</span>
        </div>

        <div class="item">
            <img src="https://media.tenor.com/K1uImj3uSYoAAAAi/doom-slayer-dance.gif" alt="Doom Player" class="icon">
            <span class="label">Doom Player</span>
        </div>

        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Team_Fortress_2_style_logo.svg/2048px-Team_Fortress_2_style_logo.svg.png" alt="TF2 Degenerate" class="icon">
            <span class="label">TF2 Degenerate</span>
        </div>

        <div class="item">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExaXJsempqaHFqa3hlN3p4cHYxZGJ5cWtqdmJzczZjam5yNmRoeTF0NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/B4dt6rXq6nABilHTYM/giphy.gif" alt="Cybersecurity Specialist" class="icon icon-rounded">
            <span class="label">Cybersecurity Specialist</span>
        </div>

        <div class="item">
            <h2>About Me</h2>
            <p>Hi! I'm a passionate gamer, cybersecurity enthusiast, and tech lover. I enjoy exploring virtual worlds and solving complex problems.</p>
        </div>

        <div class="item">
            <h2>Some of my Projects</h2>
            <ul>
                <li><a href="https://github.com/CeresF3b/NetworkScanner">PowerShell NetWork Scanner</a></li>
                <li><a href="https://github.com/CeresF3b/Ceres.github.io">This site code</a></li>
            </ul>
        </div>

        <div class="social-buttons">
            <a href="https://www.reddit.com/user/CeresF3b/">
                <img src="https://img.icons8.com/color/48/000000/reddit.png" alt="Reddit">
            </a>
            <a href="https://github.com/CeresF3b">
                <img src="https://img.icons8.com/ios-glyphs/48/ffffff/github.png" alt="GitHub">
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": true,
                        "speed": 2,
                        "opacity_min": 0,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 4,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "bounce"
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "ontouchmove": {
                        "enable": true,
                        "mode": "repulse",
                        "delay": 150
                    }
                },
                "modes": {
                    "repulse": {
                        "distance": 200,
                        "duration": 0.8,
                        "speed": 5
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });
    </script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
</body>
</html>
