<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeresF3b</title>
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('https://your-font-url-here.woff2') format('woff2');
            /* Sostituisci con il link al tuo font */
        }

        body {
            background-color: #000000;
            color: white;
            font-family: 'PixelFont', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            margin: 0 auto;
            padding: 20px;
            max-width: 800px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
        }

        .social-buttons img {
            width: 50px;
            height: 50px;
        }

        .icon {
            width: 50px;
            height: 50px;
            vertical-align: middle;
            object-fit: contain;
        }

        .cyber-icon {
            width: 55px;
            height: 55px;
            filter: brightness(0) invert(1);
            margin-right: 8px;
        }

        .label {
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        .item {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1>CeresF3b</h1>

        <div class="item">
            <img src="https://avatars.akamai.steamstatic.com/b5de1af8fcf0e8d3ef30de3888a217fea66596bc_full.jpg" alt="Helldiver" class="icon">
            <span class="label">Helldiver</span>
        </div>

        <div class="item">
            <img src="https://media.tenor.com/K1uImj3uSYoAAAAi/doom-slayer-dance.gif" alt="Doom Player" class="icon">
            <span class="label">Doom Player</span>
        </div>

        <div class="item">
            <img src="https://cdn.thingiverse.com/renders/97/21/d9/b7/6c/tf2_logo_display_large.jpg" alt="TF2 Degenerate" class="icon">
            <span class="label">TF2 Degenerate</span>
        </div>

        <div class="item">
            <img src="https://cdn-icons-png.freepik.com/512/1797/1797500.png" 
                 alt="Shield Icon" 
                 class="icon cyber-icon">
            <span class="label">Cybersecurity Specialist</span>
        </div>

        <div class="social-buttons">
            <a href="https://www.reddit.com/user/CeresF3b/">
                <img src="https://img.icons8.com/color/48/000000/reddit.png" alt="Reddit">
            </a>
            <a href="https://github.com/CeresF3b">
                <img src="https://img.icons8.com/ios-glyphs/48/ffffff/github.png" alt="GitHub">
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {"value": 100},
                "color": {"value": "#ffffff"},
                "shape": {"type": "circle"},
                "opacity": {"value": 0.5},
                "size": {"value": 3},
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {"enable": true, "speed": 2}
            },
            "interactivity": {
                "events": {
                    "onhover": {"enable": false},
                    "onclick": {"enable": false}
                }
            }
        });
    </script>
</body>
</html>
