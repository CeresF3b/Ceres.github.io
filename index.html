<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeresF3b</title>
    
    <!-- Font e stili combinati -->
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('https://your-website.com/fonts/PixelFont.woff2') format('woff2');
        }

        body {
            background-color: #000000;
            color: white;
            font-family: 'PixelFont', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 0;
            touch-action: manipulation; /* Nuovo: migliora il touch */
        }

        .container {
            position: relative;
            z-index: 1;
            margin: 0 auto;
            padding: 20px;
            max-width: 800px;
            pointer-events: none;
        }

        .container > * {
            pointer-events: auto;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
        }

        .social-buttons img {
            width: 50px;
            height: 50px;
        }

        .icon {
            width: 50px;
            height: 50px;
            vertical-align: middle;
        }

        .icon-rounded {
            border-radius: 10px;
        }

        .label {
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        .item {
            margin: 20px 0;
        }

        /* Stili per mobile */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                max-width: 95%;
            }
            
            .icon {
                width: 40px;
                height: 40px;
            }
            
            .label {
                font-size: 0.9em;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1>CeresF3b</h1>

        <div class="item">
            <img src="https://avatars.akamai.steamstatic.com/b5de1af8fcf0e8d3ef30de3888a217fea66596bc_full.jpg" alt="Helldiver" class="icon">
            <span class="label">Helldiver</span>
        </div>

        <div class="item">
            <img src="https://media.tenor.com/K1uImj3uSYoAAAAi/doom-slayer-dance.gif" alt="Doom Player" class="icon">
            <span class="label">Doom Player</span>
        </div>

        <div class="item">
            <img src="https://cdn.thingiverse.com/renders/97/21/d9/b7/6c/tf2_logo_display_large.jpg" alt="TF2 Degenerate" class="icon">
            <span class="label">TF2 Degenerate</span>
        </div>

        <div class="item">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExeHEwczUybzZhYmFhOGdqYWtwaHM5bzYzNTM0eXAwMHI4emcza3EwbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WRoLGgwE4xTQYTxyJg/giphy.gif" alt="Cybersecurity Specialist" class="icon icon-rounded">
            <span class="label">Cybersecurity Specialist</span>
        </div>

        <div class="social-buttons">
            <a href="https://www.reddit.com/user/CeresF3b/">
                <img src="https://img.icons8.com/color/48/000000/reddit.png" alt="Reddit">
            </a>
            <a href="https://github.com/CeresF3b">
                <img src="https://img.icons8.com/ios-glyphs/48/ffffff/github.png" alt="GitHub">
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": true,
                        "speed": 2,
                        "opacity_min": 0,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 4,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "bounce" /* Cambiato per mobile */
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "ontouchmove": { /* Nuovo: gestione del touch */
                        "enable": true,
                        "mode": "repulse",
                        "delay": 150
                    }
                },
                "modes": {
                    "repulse": {
                        "distance": 200,
                        "duration": 0.8,
                        "speed": 5 /* Aumentato per mobile */
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });
    </script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
</body>
</html>
